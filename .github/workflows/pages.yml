name: Deploy website to GitHub Pages

# Builds the PH Navigator site and publishes it to GitHub Pages on every push
# to main. Requires Settings → Pages → Source to be set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Build website
        run: pnpm run build:worker
        env:
          # Serve from the Pages subfolder (e.g. /phanavigator/), or / with a custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          PORT: 3000
      - name: Enable direct links to inner pages
        # GitHub Pages has no SPA fallback, so serve the app for unknown paths
        run: cp artifacts/ph-navigator/dist/public/index.html artifacts/ph-navigator/dist/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/ph-navigator/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
